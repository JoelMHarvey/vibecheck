name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '14 4 * * 3'   # Wednesdays, UTC: a quiet week is still tested

# Read-only by default; only self-scan, which posts the PR comment, asks for
# more. The test job runs the pull request's own code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the package declares; the action runs on whatever
        # interpreter the runner already has, so all three OSes matter.
        # ubuntu-24.04, not -latest: Ubuntu 26.04 runners have no Python 3.9
        # for setup-python (from November 2026), and 3.9 is the floor.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v

  # The same suite with the server's own dependencies and a browser. The
  # matrix above installs nothing, so the tests that need `cryptography` (the
  # real signing library the site signs with) and Playwright (the report and
  # check pages driven in Chromium) skip there: 21 of them. Here they run.
  server:
    name: tests with requirements.txt and Chromium (nothing skips)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # the Dockerfile's
          cache: pip
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: tests, failing if any was skipped
        run: |
          python -m unittest discover -s tests 2>&1 | tee unittest.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -qE '^OK \(.*skipped=' unittest.log; then
            echo "::error::tests were skipped in the job that exists to run them"
            exit 1
          fi

  # Dogfooding: the action runs against its own repository. It scores 100/100
  # on itself, so a drop is a real regression and should fail the build.
  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          sarif-file: vibecheck.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: vibecheck.sarif
    permissions:
      contents: read
      pull-requests: write
      security-events: write

  # Everything above tests the working tree. People run the published tag,
  # and nothing above would notice if it broke or fell behind. These two jobs
  # look at the tag itself, once a week and when run by hand; they stay out
  # of pushes and pull requests so that a merge to main is never red merely
  # because the release has not been cut yet (RELEASING.md).

  # The Action exactly as the README tells people to use it.
  published-tag:
    name: the Action from the published v1 tag
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This repository scores 100 at the tag's rules too, or the job fails
      # on the default fail-on: high.
      - uses: JoelMHarvey/vibecheck@v1
        with:
          comment: 'false'
      # The planted sample app: the published scanner must still find it.
      - id: sample
        uses: JoelMHarvey/vibecheck@v1
        with:
          path: vibecheck/checks/security/fixtures/sample-app
          fail-on: never
          comment: 'false'
          summary: 'false'
      - name: the sample app's planted criticals are found
        env:
          CRITICAL: ${{ steps.sample.outputs.critical }}
        run: |
          echo "critical findings in the sample app: ${CRITICAL:-none reported}"
          if [ -z "$CRITICAL" ] || [ "$CRITICAL" -lt 1 ]; then
            echo "::error::the published v1 found no critical finding in the planted sample app"
            exit 1
          fi

  # Is v1 behind main by something users would run? Site-only merges
  # (pages, api/, server/) do not count; the scanner and the Action do.
  tag-drift:
    name: v1 is level with main for the scanner and the Action
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: v1 points at the newest v1.x.y, and main has nothing unreleased
        run: |
          newest=$(git tag -l 'v1.*.*' --sort=-v:refname | head -n 1)
          v1_commit=$(git rev-parse 'v1^{commit}')
          newest_commit=$(git rev-parse "${newest}^{commit}")
          echo "v1 -> ${v1_commit}"
          echo "${newest} -> ${newest_commit}"
          fail=0
          if [ "$v1_commit" != "$newest_commit" ]; then
            echo "::error::v1 does not point at ${newest}, the newest v1 release (RELEASING.md, step 5)"
            fail=1
          fi
          unreleased=$(git log --oneline "v1..HEAD" -- vibecheck action.yml action_entry.py)
          if [ -n "$unreleased" ]; then
            echo "::error::main has scanner or Action changes that v1 does not: cut a release (RELEASING.md)"
            echo "$unreleased"
            fail=1
          else
            echo "nothing in vibecheck/, action.yml or action_entry.py is ahead of v1"
          fi
          exit "$fail"
