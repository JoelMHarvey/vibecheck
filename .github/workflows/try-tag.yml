# Temporary: runs the Action from the published tag v1.2.1 before `v1` is
# moved (RELEASING.md, step 4). This branch is not for merging.
name: try-tag
on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JoelMHarvey/vibecheck@v1.2.1
