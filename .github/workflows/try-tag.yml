# Temporary: runs the Action from the published tag v1.2.0 before `v1` is
# moved (RELEASING.md, step 4). This branch is not for merging.
name: try-tag
on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JoelMHarvey/vibecheck@v1.2.0
        with:
          sarif-file: try.sarif
          json-file: try.json
      - name: what the reports say made them
        run: |
          python3 -c "import json;print('sarif driver version:', json.load(open('try.sarif'))['runs'][0]['tool']['driver']['version']);print('json scanner:', json.load(open('try.json'))['scanner'])"
